name: build-apk

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor"
        required: true
        default: "playstore"
        type: choice
        options: [playstore, fdroid]
      variant:
        description: "Build variant"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
      runtime_source:
        description: "build = compile runtime; from_release = use runtime-bundle.zip from a release"
        required: true
        default: "build"
        type: choice
        options: [build, from_release]
      release_tag:
        description: "Release tag with runtime-bundle.zip (from_release). Empty = latest"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish APK + runtime-bundle.zip to GitHub Releases"
        required: false
        default: true
        type: boolean
      publish_tag:
        description: "Release tag to create/update (empty = auto runtime-YYYYMMDD-HHMMSS)"
        required: false
        default: ""
        type: string
  push:
    branches: [ps4emu]
    paths:
      - "runtime/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  runtime:
    if: github.event_name == 'push' || github.event.inputs.runtime_source == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build + package runtime (Debian Trixie)
        uses: addnab/docker-run-action@v3
        with:
          image: debian:trixie
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends git nodejs ca-certificates python3 zip
            git config --global --add safe.directory /workspace
            bash runtime/scripts/install-debian-runtime-deps.sh
            find runtime/sources/shadps4/externals -maxdepth 1 -type d -empty -delete || true
            rm -rf runtime/sources/shadps4/externals/zlib-ng
            python3 runtime/scripts/populate-shadps4-submodules.py runtime/sources/shadps4
            bash runtime/scripts/build-runtime-debian.sh
            OUT_DIR=runtime/build/runtime-out
            STAGE_DIR=runtime/build/ci-stage
            mkdir -p "$OUT_DIR" "$STAGE_DIR/assets/runtime" "$STAGE_DIR/jniLibs/arm64-v8a"
            node runtime/scripts/package-runtime.mjs "$OUT_DIR"
            cp -a "$OUT_DIR"/. "$STAGE_DIR/assets/runtime/"
            if [ -d app/src/main/jniLibs/arm64-v8a ]; then cp -a app/src/main/jniLibs/arm64-v8a/. "$STAGE_DIR/jniLibs/arm64-v8a/"; fi
            if [ -d app/src/main/assets/runtime ]; then cp -a app/src/main/assets/runtime/. "$STAGE_DIR/assets/runtime/"; fi
            test -f "$STAGE_DIR/assets/runtime/manifest.json"
            test -f "$STAGE_DIR/assets/runtime/runtime.zip"
            chown -R "$(stat -c '%u:%g' /workspace)" runtime/build "$STAGE_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-bundle
          path: runtime/build/ci-stage/
          if-no-files-found: error
          retention-days: 30

      - name: Pack runtime-bundle.zip
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          (cd runtime/build/ci-stage && zip -r -9 "$GITHUB_WORKSPACE/runtime-bundle.zip" .)
          ls -lh runtime-bundle.zip

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-bundle-zip
          path: runtime-bundle.zip
          if-no-files-found: error
          retention-days: 30

  fetch-runtime:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.runtime_source == 'from_release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download runtime-bundle.zip from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p runtime/build/ci-stage download
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG=""
            while read -r t; do
              [ -z "$t" ] && continue
              if gh api "repos/${{ github.repository }}/releases/tags/${t}" --jq '.assets[].name' | grep -qx 'runtime-bundle.zip'; then
                TAG="$t"
                break
              fi
            done < <(gh api "repos/${{ github.repository }}/releases?per_page=30" --jq '.[].tag_name')
            [ -n "$TAG" ] || { echo "No release with runtime-bundle.zip"; exit 1; }
          fi
          echo "Using release tag: $TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "runtime-bundle.zip" --dir download
          unzip -q download/runtime-bundle.zip -d runtime/build/ci-stage
          cp -a download/runtime-bundle.zip "$GITHUB_WORKSPACE/runtime-bundle.zip"
          find runtime/build/ci-stage -maxdepth 3 -type f | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-bundle
          path: runtime/build/ci-stage/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-bundle-zip
          path: runtime-bundle.zip
          if-no-files-found: error
          retention-days: 30

  apk:
    needs: [runtime, fetch-runtime]
    if: always() && (needs.runtime.result == 'success' || needs.fetch-runtime.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_ROOT: runtime/sources/shadps4/android/BachataS4
      FLAVOR: ${{ github.event.inputs.flavor || 'playstore' }}
      VARIANT: ${{ github.event.inputs.variant || 'debug' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Populate shadPS4 externals
        run: |
          set -euo pipefail
          find runtime/sources/shadps4/externals -maxdepth 1 -type d -empty -delete || true
          rm -rf runtime/sources/shadps4/externals/zlib-ng
          python3 runtime/scripts/populate-shadps4-submodules.py runtime/sources/shadps4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-bundle
          path: runtime/build/ci-stage

      - name: Stage runtime into Android project
        run: |
          set -euo pipefail
          ASSETS_DIR="$APP_ROOT/app/src/main/assets/runtime"
          JNI_DIR="$APP_ROOT/app/src/main/jniLibs/arm64-v8a"
          STAGE=runtime/build/ci-stage
          mkdir -p "$ASSETS_DIR" "$JNI_DIR"
          if [ -d "$STAGE/assets/runtime" ]; then
            cp -a "$STAGE/assets/runtime"/. "$ASSETS_DIR/"
          elif [ -f "$STAGE/runtime.zip" ]; then
            cp -a "$STAGE"/. "$ASSETS_DIR/"
          else
            find "$STAGE" | head -50; exit 1
          fi
          if [ -d "$STAGE/jniLibs/arm64-v8a" ]; then
            cp -a "$STAGE/jniLibs/arm64-v8a"/. "$JNI_DIR/"
          fi
          test -f "$ASSETS_DIR/runtime.zip"
          ls -la "$ASSETS_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: cmdline-tools;latest

      - name: Install SDK components
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$SDK/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for c in "platforms;android-37" "platforms;android-36" "platforms;android-35"; do
            sdkmanager --install "$c" && break || true
          done
          sdkmanager --install "build-tools;35.0.0" || true
          for ndk in "ndk;29.0.14206865" "ndk;28.2.13676358" "ndk;27.2.12479018"; do
            if sdkmanager --install "$ndk"; then
              echo "ANDROID_NDK_HOME=$SDK/ndk/${ndk#ndk;}" >> "$GITHUB_ENV"
              break
            fi
          done
          sdkmanager --install "cmake;3.22.1" || true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('runtime/sources/shadps4/android/BachataS4/**/*.gradle*') }}

      - name: Assemble APK
        working-directory: ${{ env.APP_ROOT }}
        run: |
          set -euo pipefail
          TASK="assemble${FLAVOR^}${VARIANT^}"
          echo "Running ./gradlew $TASK"
          chmod +x gradlew
          ./gradlew "$TASK" --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bachatas4-${{ env.FLAVOR }}-${{ env.VARIANT }}
          path: ${{ env.APP_ROOT }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [runtime, fetch-runtime, apk]
    if: |
      always() &&
      needs.apk.result == 'success' &&
      (needs.runtime.result == 'success' || needs.fetch-runtime.result == 'success') &&
      (github.event_name == 'push' || github.event.inputs.publish_release == true || github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'playstore' }}
      VARIANT: ${{ github.event.inputs.variant || 'debug' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bachatas4-${{ env.FLAVOR }}-${{ env.VARIANT }}
          path: publish/apk

      - uses: actions/download-artifact@v4
        with:
          name: runtime-bundle-zip
          path: publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find publish/apk -name '*.apk' | head -1)
          test -n "$APK"
          test -f publish/runtime-bundle.zip
          APK_NAME="bachatas4-${FLAVOR}-${VARIANT}.apk"
          mkdir -p publish/out
          cp -a "$APK" "publish/out/${APK_NAME}"
          cp -a publish/runtime-bundle.zip publish/out/

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.publish_tag }}" ]; then
            TAG="${{ github.event.inputs.publish_tag }}"
          else
            TAG="runtime-$(date -u +%Y%m%d-%H%M%S)"
          fi

          TITLE="onRps4 ${TAG} (${FLAVOR}/${VARIANT})"
          NOTES="## Artifacts

- ${APK_NAME}
- runtime-bundle.zip (reuse via Actions → build-apk → runtime_source=from_release, release_tag=${TAG})

SHA: ${{ github.sha }}
Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "publish/out/${APK_NAME}" publish/out/runtime-bundle.zip \
              --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NOTES"
          else
            gh release create "$TAG" "publish/out/${APK_NAME}" publish/out/runtime-bundle.zip \
              --repo "${{ github.repository }}" --title "$TITLE" --notes "$NOTES" --latest
          fi
          echo "Published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
