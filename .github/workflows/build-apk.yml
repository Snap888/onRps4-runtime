name: build-apk

# Builds the BachataS4 Android APK (playstoreDebug by default).
# 1) Builds the managed runtime (box64 + shadPS4 + rootfs) in Debian Trixie
# 2) Packages runtime.zip + manifest + host jniLibs into the Android app tree
# 3) Assembles the APK with Gradle and uploads the artifact

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor"
        required: true
        default: "playstore"
        type: choice
        options:
          - playstore
          - fdroid
      variant:
        description: "Build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - ps4emu
    paths:
      - "runtime/**"
      - "runtime/sources/shadps4/android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Runtime build (Debian Trixie container) ----
      - name: Build runtime inside Debian Trixie
        uses: addnab/docker-run-action@v3
        with:
          image: debian:trixie
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends git nodejs ca-certificates python3
            git config --global --add safe.directory /workspace

            # Official dependency list for box64 / shadPS4 / cross toolchain
            bash runtime/scripts/install-debian-runtime-deps.sh

            # Clean partial submodule clones that break populate
            find runtime/sources/shadps4/externals -maxdepth 1 -type d -empty -delete || true
            rm -rf runtime/sources/shadps4/externals/zlib-ng

            python3 runtime/scripts/populate-shadps4-submodules.py runtime/sources/shadps4

            bash runtime/scripts/build-runtime-debian.sh

            # MUST write into the mounted workspace — container /tmp is discarded.
            APP_ROOT="runtime/sources/shadps4/android/BachataS4"
            ASSETS_DIR="$APP_ROOT/app/src/main/assets/runtime"
            JNI_DIR="$APP_ROOT/app/src/main/jniLibs/arm64-v8a"
            OUT_DIR="runtime/build/runtime-out"
            mkdir -p "$OUT_DIR" "$ASSETS_DIR" "$JNI_DIR"

            node runtime/scripts/package-runtime.mjs "$OUT_DIR"

            # Stage into the Android app tree (same filesystem = survives container exit)
            cp -a "$OUT_DIR"/. "$ASSETS_DIR/"

            # package-runtime may also emit host jniLibs at the default app/ path
            if [ -d app/src/main/jniLibs/arm64-v8a ]; then
              cp -a app/src/main/jniLibs/arm64-v8a/. "$JNI_DIR/"
            fi
            if [ -d app/src/main/assets/runtime ]; then
              cp -a app/src/main/assets/runtime/. "$ASSETS_DIR/"
            fi

            echo "Packaged runtime assets:"
            ls -la "$ASSETS_DIR"
            ls -la "$JNI_DIR" || true
            test -f "$ASSETS_DIR/manifest.json" || test -f "$ASSETS_DIR/runtime.zip" || {
              echo "ERROR: neither manifest.json nor runtime.zip in $ASSETS_DIR" >&2
              exit 1
            }

      - name: Place runtime assets into Android project
        run: |
          set -euo pipefail
          APP_ROOT="runtime/sources/shadps4/android/BachataS4"
          ASSETS_DIR="$APP_ROOT/app/src/main/assets/runtime"
          JNI_DIR="$APP_ROOT/app/src/main/jniLibs/arm64-v8a"
          OUT_DIR="runtime/build/runtime-out"

          mkdir -p "$ASSETS_DIR" "$JNI_DIR"

          # Idempotent copy if the docker step already staged files
          if [ -d "$OUT_DIR" ]; then
            cp -a "$OUT_DIR"/. "$ASSETS_DIR/"
          fi
          if [ -d app/src/main/jniLibs/arm64-v8a ]; then
            cp -a app/src/main/jniLibs/arm64-v8a/. "$JNI_DIR/"
          fi
          if [ -d app/src/main/assets/runtime ]; then
            cp -a app/src/main/assets/runtime/. "$ASSETS_DIR/"
          fi

          echo "Assets present on host:"
          ls -la "$ASSETS_DIR"
          ls -la "$JNI_DIR" || true
          if [ ! -f "$ASSETS_DIR/manifest.json" ] && [ ! -f "$ASSETS_DIR/runtime.zip" ]; then
            echo "ERROR: runtime assets missing after docker package step" >&2
            exit 1
          fi

      # ---- Android SDK / NDK / Gradle ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do not install the obsolete "tools" package (removed from current SDK repos).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: cmdline-tools;latest

      - name: Install Android SDK components
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=$SDK"

          # Prefer latest cmdline-tools for up-to-date package index (API 37+).
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          elif [ -d "$SDK/cmdline-tools/bin" ]; then
            export PATH="$SDK/cmdline-tools/bin:$PATH"
          fi
          command -v sdkmanager
          sdkmanager --version || true

          # Accept all licenses non-interactively (required for AGP auto-download too).
          mkdir -p "$SDK/licenses"
          for lic in android-sdk-license android-sdk-preview-license \
              android-sdk-arm-dbt-license google-gdk-license \
              mips-android-sysimage-license; do
            echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/$lic"
          done
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          install_pkg() {
            local pkg="$1"
            echo ">> sdkmanager --install $pkg"
            if sdkmanager --install "$pkg"; then
              echo "OK: $pkg"
              return 0
            fi
            echo "SKIP: $pkg (not available or already present)"
            return 1
          }

          PLATFORM_OK=0
          for candidate in "platforms;android-37" "platforms;android-36" "platforms;android-35"; do
            if install_pkg "$candidate"; then
              PLATFORM_OK=1
              break
            fi
          done
          if [ "$PLATFORM_OK" -ne 1 ]; then
            echo "No platform package preinstalled; AGP may download platforms;android-37 during Gradle."
            sdkmanager --list 2>/dev/null | grep -E 'platforms;android-' | head -40 || true
          fi

          install_pkg "build-tools;35.0.0" || install_pkg "build-tools;34.0.0" || true

          NDK_VER=""
          for ndk in "ndk;29.0.14206865" "ndk;28.2.13676358" "ndk;27.2.12479018"; do
            if install_pkg "$ndk"; then
              NDK_VER="${ndk#ndk;}"
              break
            fi
          done
          if [ -n "$NDK_VER" ]; then
            echo "NDK_VERSION=$NDK_VER" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VER" >> "$GITHUB_ENV"
          else
            echo "::warning::No NDK package installed; prebuilt jniLibs may still assemble."
          fi

          install_pkg "cmake;3.22.1" || install_pkg "cmake;3.31.0" || true

          echo "Installed SDK packages:"
          ls -la "$SDK/platforms" 2>/dev/null || true
          ls -la "$SDK/ndk" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('runtime/sources/shadps4/android/BachataS4/**/*.gradle*', 'runtime/sources/shadps4/android/BachataS4/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Assemble APK
        working-directory: runtime/sources/shadps4/android/BachataS4
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          FLAVOR="${{ github.event.inputs.flavor || 'playstore' }}"
          VARIANT="${{ github.event.inputs.variant || 'debug' }}"
          TASK="assemble${FLAVOR^}${VARIANT^}"
          echo "Running ./gradlew $TASK"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          chmod +x gradlew
          ./gradlew "$TASK" --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bachatas4-${{ github.event.inputs.flavor || 'playstore' }}-${{ github.event.inputs.variant || 'debug' }}
          path: |
            runtime/sources/shadps4/android/BachataS4/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
